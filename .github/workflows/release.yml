name: release

# Attaches LoWRecomp-v<VERSION>-Windows-x64.zip (installer + sources +
# recomplauncher.json, no game files) to every published GitHub release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the release zip
        run: python tools/make_release.py --out dist
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
