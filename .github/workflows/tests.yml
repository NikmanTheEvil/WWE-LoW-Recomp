name: tests

on:
  push:
  pull_request:

jobs:
  tools:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Recipe is valid JSON without image data
        run: python -c "import json; r=json.load(open('tools/data/kbhud_recipe.json')); assert r['version']==1 and r['archives']"
